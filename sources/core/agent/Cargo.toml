# The SpecBoard agent: the daemon (serve) holds the projects' database and the core, and answers MCP for
# its projects. The app reaches it over SSH through a relay started per connection (attach), the way
# Claude Code works over SSH
[package]
name = "specboard-agent"
description = "The SpecBoard agent: holds projects and answers MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
# `raw_value`: the hub hands the body of a line on as it was written, without reading it
# (`hub::serve`).
serde_json = { workspace = true, features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
specboard-core = { path = "..", features = ["dynamic-grammars"] }
libc = "0.2"

# The agent's allocator on Linux: musl's (the agent is linked statically with it) and glibc's keep what
# a read of a whole project let go of, so a long-running agent grows to the most it ever held at once.
[target.'cfg(target_os = "linux")'.dependencies]
# Without transparent huge pages: on a host that gives them to every process, a freed block inside one
# would keep the whole page.
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[dev-dependencies]
# A database a newer core moved on is made in the tests by writing its mark.
rusqlite = { version = "0.40", features = ["bundled"] }
